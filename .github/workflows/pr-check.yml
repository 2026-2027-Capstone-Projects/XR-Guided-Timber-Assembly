name: PR Test and Build

on:
  pull_request:
    branches: [ "main", "master", "develop" ]


jobs:
  # lint C# code in the Unity project's Assets tree, to ensure it complies with .editorconfig
  lint:
    name: Lint C# Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# Formatting (dotnet format)
        # --folder lints Assets/ directly without requiring Unity's gitignored .sln/.csproj files
        run: dotnet format whitespace Timber-Assembly/Assets --folder --verify-no-changes --verbosity diagnostic

  # Check if files in the Timber-Assembly project directory have been changed
  project-changes:
    name: Detect Unity Project Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            unity:
              - 'Timber-Assembly/**'

  # Run Editor and Runtime tests, and build the game (Can take an hour)
  test-and-build:
    name: Run Tests & Verify Build
    needs: [lint, project-changes]
    # Skip running tests if project files have not been changed
    if: needs.project-changes.result == 'success' && needs.project-changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Timber-Assembly/Library
          key: Library-${{ hashFiles('Timber-Assembly/Assets/**', 'Timber-Assembly/Packages/**', 'Timber-Assembly/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode and PlayMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Timber-Assembly
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Build Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Timber-Assembly
          # Use Android for Meta Quest / XR APK builds, or StandaloneWindows64 / StandaloneLinux64 for desktop
          targetPlatform: Android
          buildsPath: Timber-Assembly/build
          allowDirtyBuild: true # Nuclear Option